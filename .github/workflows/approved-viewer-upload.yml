name: Upload approved Viewer v0.6.20
on: workflow_dispatch
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify approved Viewer and upload draft assets only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd approved/v0.6.20
          sha256sum -c DRAMA-plus-v0.6.20.apk.sha256
          gh release upload v0.6.20 DRAMA-plus-v0.6.20.apk viewer-update.json DRAMA-plus-v0.6.20.apk.sha256 --repo xjitroy/Drama-Plus-Public --clobber
